# EXPERIMENTAL: cross-compiles the audio.cpp C API (libaudiocpp.so) for Android so
# Your Friend can run OmniVoice in-process. audio.cpp does not officially support
# Android; this workflow may need adjustments when audio.cpp changes.
# Run it manually from the Actions tab, then download the artifact and import the
# .so in the app (Voice > OmniVoice engine library).
name: Build audio.cpp for Android (experimental)

on:
  workflow_dispatch:
    inputs:
      audiocpp_ref:
        description: "audio.cpp git ref (tag, branch or commit)"
        required: true
        default: "main"
      abi:
        description: "Android ABI"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [ "arm64-v8a", "x86_64" ]

jobs:
  build-audiocpp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out audio.cpp
        uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: ${{ inputs.audiocpp_ref }}
          submodules: recursive
          path: audiocpp

      - name: Install NDK (must match the app's ndkVersion)
        run: |
          # Use the SDK preinstalled on GitHub's Ubuntu runners (the setup-android action fails on
          # the removed legacy "tools" package). Pick the newest cmdline-tools sdkmanager.
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018"

      - name: Install Ninja
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cmake -S audiocpp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ inputs.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOCPP_BUILD_C_API=ON \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON \
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=OFF \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_METAL=OFF

      - name: Build libaudiocpp.so
        run: cmake --build build --target audiocpp -j 4

      - name: Collect library and its companions
        run: |
          mkdir -p out
          # libaudiocpp.so plus any other shared libraries the build produced (e.g. ggml backends)
          find build -name '*.so*' -type f -exec cp -L {} out/ \;
          # The C++ runtime it was linked against (c++_shared) must be imported too.
          case "${{ inputs.abi }}" in
            arm64-v8a) TRIPLE=aarch64-linux-android ;;
            x86_64) TRIPLE=x86_64-linux-android ;;
          esac
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/$TRIPLE/libc++_shared.so" out/
          ls -la out
          for f in out/*.so*; do echo "== $f"; "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d "$f" | grep NEEDED || true; done

      - uses: actions/upload-artifact@v4
        with:
          name: libaudiocpp-${{ inputs.abi }}
          path: out/

# EXPERIMENTAL: cross-compiles the audio.cpp C API (libaudiocpp.so) for Android so
# Your Friend can run OmniVoice in-process. audio.cpp does not officially support
# Android; this workflow may need adjustments when audio.cpp changes.
# Run it manually from the Actions tab, then download the artifact and import the
# .so in the app (Voice > OmniVoice engine library).
name: Build audio.cpp for Android (experimental)

on:
  workflow_dispatch:
    inputs:
      audiocpp_ref:
        description: "audio.cpp git ref (tag, branch or commit)"
        required: true
        default: "main"
      abi:
        description: "Android ABI"
        required: true
        default: "arm64-v8a"
        type: choice
        options: [ "arm64-v8a", "x86_64" ]

jobs:
  build-audiocpp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out audio.cpp
        uses: actions/checkout@v4
        with:
          repository: 0xShug0/audio.cpp
          ref: ${{ inputs.audiocpp_ref }}
          submodules: recursive
          path: audiocpp

      - uses: android-actions/setup-android@v3

      - name: Install NDK (must match the app's ndkVersion)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018"

      - name: Configure
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          cmake -S audiocpp -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ inputs.abi }} \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DAUDIOCPP_BUILD_C_API=ON \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON \
            -DAUDIOCPP_BUILD_NATIVE_MODEL_MANAGER=OFF \
            -DENGINE_ENABLE_OPENMP=OFF \
            -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_CUDA=OFF -DENGINE_ENABLE_HIP=OFF \
            -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_METAL=OFF

      - name: Build libaudiocpp.so
        run: cmake --build build --target audiocpp -j 4

      - name: Collect library
        run: |
          mkdir -p out
          find build -name 'libaudiocpp.so*' -exec cp -L {} out/ \;
          ls -la out
          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d out/libaudiocpp.so | grep NEEDED || true

      - uses: actions/upload-artifact@v4
        with:
          name: libaudiocpp-${{ inputs.abi }}
          path: out/

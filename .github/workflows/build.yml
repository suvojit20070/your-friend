name: Android build

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PLATFORM: "platforms;android-35"
      ANDROID_BUILD_TOOLS: "build-tools;35.0.0"
      ANDROID_NDK: "ndk;27.2.12479018"
      ANDROID_CMAKE: "cmake;3.22.1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform, build tools, NDK and CMake
        run: |
          # Use the SDK preinstalled on GitHub's Ubuntu runners (the setup-android action fails on
          # the removed legacy "tools" package). Pick the newest cmdline-tools sdkmanager.
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "$ANDROID_NDK" "$ANDROID_CMAKE"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate resources and translations
        run: python3 tools/check_resources.py

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: YourFriend-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Run lint
        if: ${{ !cancelled() }}
        run: ./gradlew --stacktrace lintDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-logs
          path: |
            app/.cxx/**/*.log
            app/.cxx/**/CMakeError.log
          if-no-files-found: ignore

  release:
    name: Signed release APK (only when signing secrets exist)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing secrets
        id: secrets
        env:
          KS: ${{ secrets.YF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-java@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK components
        if: steps.secrets.outputs.present == 'true'
        run: |
          # Use the SDK preinstalled on GitHub's Ubuntu runners (the setup-android action fails on
          # the removed legacy "tools" package). Pick the newest cmdline-tools sdkmanager.
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.secrets.outputs.present == 'true'

      - name: Build signed release APK
        if: steps.secrets.outputs.present == 'true'
        env:
          YF_KEYSTORE_BASE64: ${{ secrets.YF_KEYSTORE_BASE64 }}
          YF_KEYSTORE_PASSWORD: ${{ secrets.YF_KEYSTORE_PASSWORD }}
          YF_KEY_ALIAS: ${{ secrets.YF_KEY_ALIAS }}
          YF_KEY_PASSWORD: ${{ secrets.YF_KEY_PASSWORD }}
        run: |
          echo "$YF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export YF_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          chmod +x ./gradlew
          ./gradlew --stacktrace assembleRelease

      - name: Upload release APK
        if: steps.secrets.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YourFriend-release-apk
          path: app/build/outputs/apk/release/*.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.suvo.agent'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.suvo.agent'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'


        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -fexceptions'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release signing is configured from environment variables (GitHub Secrets).
            def ks = System.getenv('YF_KEYSTORE_PATH')
            if (ks != null && !ks.isEmpty() && file(ks).exists()) {
                signingConfig signingConfigs.create('ciRelease') {
                    storeFile file(ks)
                    storePassword System.getenv('YF_KEYSTORE_PASSWORD')
                    keyAlias System.getenv('YF_KEY_ALIAS')
                    keyPassword System.getenv('YF_KEY_PASSWORD')
                    // All three schemes: v1 (JAR) for old installers and tools, v2 for speed and
                    // integrity, v3 for key rotation. (AGP leaves v1 off for minSdk >= 24 unless asked.)
                    enableV1Signing true
                    enableV2Signing true
                    enableV3Signing true
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
        xmlReport true
        htmlReport true
        // Hinglish uses the BCP-47 qualifier b+hi+Latn; translations are reviewed manually.
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
            all {
                testLogging {
                    events 'failed', 'passed'
                    exceptionFormat 'full'
                }
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    // Material 3 components: MaterialSwitch and Slider (the rest of the UI is the app's own).
    implementation 'com.google.android.material:material:1.12.0'
    // Shizuku (optional elevated device control via ADB/root identity, no root required).
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // SSH tool.
    implementation 'com.github.mwiede:jsch:2.28.8'
    // Offline wake word: Vosk (Kaldi speech engine in C++, called through JNA). The ~40 MB model
    // is downloaded inside the app when hands-free is switched on; it is not in the APK.
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.alphacephei:vosk-android:0.3.47@aar'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is stubbed on the JVM; use the reference implementation in unit tests.
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
